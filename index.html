<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>PUERTA — BLIND</title>
<!--
  ══════════════════════════════════════════════════════════════
  ESCÁNER DE PUERTA — BLIND
  Se aloja FUERA de Apps Script, en GitHub Pages.
  ══════════════════════════════════════════════════════════════

  ¿Por qué fuera? En iPhone, Google sirve las páginas de Apps
  Script dentro de un iframe sin permiso de cámara y Safari la
  bloquea. En una página propia sí funciona.

  ── YA ESTÁ CONFIGURADO ───────────────────────────────────────
  URL_APP y CLAVE vienen con los valores reales. No hay que
  editar nada. El archivo ya se llama index.html.

  ── ANTES DE PUBLICAR ─────────────────────────────────────────
  En Apps Script, desplegar VERSIÓN NUEVA del Codigo.gs
  actualizado. Sin eso el escáner carga pero no valida.

  ── PUBLICAR ──────────────────────────────────────────────────
  1. github.com → New repository → nombre "puerta" → Public
  2. Add file → Upload files → subir este archivo tal cual
  3. Settings → Pages → Branch: main / root → Save
  4. A los dos minutos: https://TU-USUARIO.github.io/puerta/

  ── ADVERTENCIA ───────────────────────────────────────────────
  La clave queda visible en el código de esta página. El link no
  puede circular fuera del equipo.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --negro:#0B0B0B; --tinta:#141414; --linea:#2A2A2A;
    --hueso:#F2F2F0; --tenue:#8A8A87;
    --ok:#0B7A3B; --alerta:#B8860B; --malo:#B00020;
    color-scheme: dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--negro);color:var(--hueso);
    font-family:'Space Grotesk',-apple-system,Helvetica,sans-serif;
    overscroll-behavior:none;}
  body{display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}

  header{display:flex;align-items:baseline;justify-content:space-between;
    padding:16px 18px 12px;border-bottom:1px solid var(--linea);}
  .marca{font-weight:700;font-size:17px;letter-spacing:.34em;}
  .rol{font-family:'Space Mono',monospace;font-size:10px;
    letter-spacing:.26em;color:var(--tenue);}

  .conteo{display:flex;border-bottom:1px solid var(--linea);}
  .kpi{flex:1;padding:14px 18px;border-right:1px solid var(--linea);}
  .kpi:last-child{border-right:0;}
  .kpi b{display:block;font-family:'Space Mono',monospace;
    font-size:30px;font-weight:700;line-height:1;}
  .kpi span{display:block;font-family:'Space Mono',monospace;font-size:9px;
    letter-spacing:.24em;color:var(--tenue);margin-top:7px;}

  .visor{position:relative;flex:1;min-height:250px;background:#000;overflow:hidden;}
  #lector{width:100%;height:100%;}
  #lector video{width:100%!important;height:100%!important;object-fit:cover;}
  .mira{position:absolute;inset:0;pointer-events:none;
    display:flex;align-items:center;justify-content:center;}
  .mira i{width:64%;max-width:270px;aspect-ratio:1;position:relative;}
  .mira i::before,.mira i::after{content:'';position:absolute;
    width:34px;height:34px;border:2px solid var(--hueso);}
  .mira i::before{top:0;left:0;border-right:0;border-bottom:0;}
  .mira i::after{bottom:0;right:0;border-left:0;border-top:0;}

  .placa{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:26px;
    text-align:center;background:var(--negro);}
  .placa p{margin:0;font-size:14px;line-height:1.55;color:var(--tenue);max-width:330px;}
  .placa .cod{font-family:'Space Mono',monospace;font-size:11px;
    color:#5A5A57;word-break:break-all;max-width:330px;}

  button{font-family:'Space Grotesk',sans-serif;font-weight:700;
    font-size:13px;letter-spacing:.18em;text-transform:uppercase;
    border:1px solid var(--hueso);background:var(--hueso);color:var(--negro);
    padding:15px 26px;border-radius:0;cursor:pointer;}
  button.fantasma{background:transparent;color:var(--hueso);}

  .barra{display:flex;border-top:1px solid var(--linea);background:var(--tinta);}
  .barra input{flex:1;min-width:0;padding:17px 18px;border:0;
    background:transparent;color:var(--hueso);
    font-family:'Space Mono',monospace;font-size:19px;letter-spacing:.1em;}
  .barra input::placeholder{color:#5A5A57;letter-spacing:.06em;font-size:14px;}
  .barra input:focus{outline:0;}
  .barra button{border:0;border-left:1px solid var(--linea);padding:0 24px;}

  .pie{display:flex;justify-content:space-between;align-items:center;
    gap:12px;padding:11px 18px;border-top:1px solid var(--linea);
    font-family:'Space Mono',monospace;font-size:10px;
    letter-spacing:.18em;color:var(--tenue);}
  .pie span[role=button]{cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
  .pie .on{color:var(--hueso);}

  #estado{position:fixed;inset:0;z-index:99;display:none;
    flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:30px;}
  #estado h1{margin:0;font-size:min(15vw,58px);font-weight:700;
    letter-spacing:.1em;line-height:1;}
  #estado .quien{margin:18px 0 0;font-size:24px;font-weight:500;}
  #estado .nota{margin:14px 0 0;font-family:'Space Mono',monospace;
    font-size:12px;letter-spacing:.16em;opacity:.8;}
  #estado.ver{display:flex;animation:entra .12s ease-out;}
  @keyframes entra{from{opacity:0}to{opacity:1}}

  #fallidos{padding:14px 18px;border-top:1px solid var(--malo);
    background:#1A0A0D;font-family:'Space Mono',monospace;font-size:11px;
    line-height:1.7;display:none;}
  #fallidos b{color:var(--malo);letter-spacing:.16em;}
</style>
</head>
<body>

<header>
  <div class="marca">BLIND</div>
  <div class="rol">CONTROL DE PUERTA</div>
</header>

<div class="conteo">
  <div class="kpi"><b id="kDentro">—</b><span>ADENTRO</span></div>
  <div class="kpi"><b id="kVend">—</b><span>VENDIDAS</span></div>
  <div class="kpi"><b id="kSesion">0</b><span>ESTA SESIÓN</span></div>
</div>

<div class="visor">
  <div id="lector"></div>
  <div class="mira"><i></i></div>
  <div class="placa" id="placa">
    <p>Toca para encender la cámara. El navegador va a pedir permiso.</p>
    <button onclick="arrancar()">Activar cámara</button>
    <div class="cod" id="motivo"></div>
  </div>
</div>

<div class="barra">
  <input id="manual" inputmode="numeric" autocomplete="off"
         placeholder="Número de entrada: 7">
  <button onclick="manualEnviar()">Validar</button>
</div>

<div class="pie">
  <span id="linterna" role="button" onclick="linterna()">LINTERNA</span>
  <span id="conexion" role="button" onclick="diagnostico()">LISTO</span>
  <span role="button" onclick="pedirResumen()">ACTUALIZAR</span>
</div>

<div id="fallidos"></div>
<div id="estado"></div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
/* ═══════════ CONFIGURACIÓN — LLENAR ESTAS DOS ═══════════ */
var URL_APP = 'https://script.google.com/macros/s/AKfycbzVhEzz1lq8uP1wBxGth6E9CCky3XbIKV6bFXqasWgJuOAxA6OpxHjW4O1-nUMEY3M/exec';
var CLAVE   = 'puerta-rvu171vked8pt1';
var PREFIJO = 'BLIND';
/* ════════════════════════════════════════════════════════ */

var lector=null, activo=false, torch=false, wl=null;
var ultimo='', ultimoT=0, sesion=0, nCb=0, ocupado=false;
var fallidos=[];

/* ---------- utilidades ---------- */
function $(id){ return document.getElementById(id); }

function normalizar(texto){
  var t=String(texto).trim();
  var m=t.match(/[?&]codigo=([^&#]+)/) || t.match(/[?&]c=([^&#]+)/);
  if(m) return decodeURIComponent(m[1]).toUpperCase();
  if(/^\d{1,4}$/.test(t)) return PREFIJO+'-'+('0000'+t).slice(-4);
  return t.toUpperCase();
}

/* ═══════════ TRANSPORTE ═══════════
   fetch primero: devuelve la causa real de cualquier fallo.
   JSONP de respaldo: por si el navegador bloquea la petición.
   ═════════════════════════════════ */

/* Los nombres 'c', 'k' y 't' chocan con parámetros reservados de
   Google: la petición se desvía a Drive y nunca llega al script.
   Por eso van con nombres propios. */
function armarQuery(params){
  var q = 'clave=' + encodeURIComponent(CLAVE);
  if (params.c)      q += '&codigo=' + encodeURIComponent(params.c);
  if (params.accion) q += '&accion=' + encodeURIComponent(params.accion);
  q += '&ts=' + Date.now();
  return q;
}

function llamar(params, alVolver){
  var q = armarQuery(params);
  var ctrl = window.AbortController ? new AbortController() : null;
  var corto = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 30000);
  var via = 'fetch';

  if (!window.fetch){ porJsonp(q, alVolver, 'este navegador no tiene fetch'); return; }

  fetch(URL_APP + '?api=1&' + q, {
    method: 'GET',
    redirect: 'follow',
    signal: ctrl ? ctrl.signal : undefined
  })
  .then(function(res){
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res.text();
  })
  .then(function(txt){
    clearTimeout(corto);
    var r;
    try { r = JSON.parse(txt); }
    catch(e){ throw new Error('respuesta ilegible: ' + txt.slice(0,80)); }
    r.via = via;
    alVolver(r);
  })
  .catch(function(err){
    clearTimeout(corto);
    var causa = String(err && err.message ? err.message : err);
    if (err && err.name === 'AbortError') causa = 'tardó más de 30 s';
    porJsonp(q, alVolver, causa);
  });
}

function porJsonp(q, alVolver, causaFetch){
  var cb = 'cb' + (++nCb);
  var s  = document.createElement('script');
  var listo = false;
  var t = setTimeout(function(){ fin({estado:'red', causa:'JSONP tardó demasiado'}); }, 30000);

  function fin(r){
    if(listo) return; listo = true;
    clearTimeout(t);
    try { delete window[cb]; } catch(e){ window[cb] = undefined; }
    if(s.parentNode) s.parentNode.removeChild(s);
    if(r && r.estado === 'red'){
      r.causa = 'fetch: ' + causaFetch + ' | ' + (r.causa || 'JSONP falló');
    } else if (r) {
      r.via = 'jsonp';
    }
    alVolver(r);
  }
  window[cb] = fin;
  s.onerror = function(){ fin({estado:'red', causa:'JSONP no cargó'}); };
  s.src = URL_APP + '?jsonp=' + cb + '&' + q;
  document.body.appendChild(s);
}

/* ═══════════ DIAGNÓSTICO ═══════════ */
function diagnostico(){
  var d = $('estado');
  d.style.background = '#0B0B0B';
  d.innerHTML = '<h1 style="font-size:26px">DIAGNÓSTICO</h1>' +
                '<p class="nota" id="diag">Probando…</p>';
  d.classList.add('ver');
  d.onclick = function(e){
    if(e.target && e.target.tagName === 'A') return;   // dejar pasar los enlaces
    d.classList.remove('ver');
  };

  var lineas = [];
  function pinta(){ $('diag').innerHTML = lineas.join('<br>'); }

  var uRes = URL_APP + '?api=1&' + armarQuery({accion:'resumen'});
  var uVal = URL_APP + '?api=1&' + armarQuery({c: PREFIJO + '-0001'});

  lineas.push('fetch disponible: ' + (window.fetch ? 'sí' : 'no'));
  lineas.push('');
  lineas.push('<a href="' + uRes + '" target="_blank" ' +
              'style="color:#fff">ABRIR URL DE RESUMEN</a>');
  lineas.push('<a href="' + uVal + '" target="_blank" ' +
              'style="color:#fff">ABRIR URL DE VALIDACIÓN</a>');
  lineas.push('');
  pinta();

  llamar({accion:'resumen'}, function(r){
    lineas.push('resumen → ' + (r.estado||'?') + ' vía ' + (r.via||'—'));
    if(r.causa) lineas.push('  causa: ' + r.causa);
    pinta();
    llamar({c: PREFIJO + '-0001'}, function(r2){
      lineas.push('validar → ' + (r2.estado||'?') + ' vía ' + (r2.via||'—'));
      if(r2.titulo) lineas.push('  ' + r2.titulo + ' ' + (r2.extra||''));
      if(r2.causa)  lineas.push('  causa: ' + r2.causa);
      lineas.push('');
      lineas.push('Toca para cerrar');
      pinta();
    });
  });
}

/* ---------- validación ---------- */
function validar(codigo, reintento){
  if(ocupado||!codigo) return;
  ocupado=true;
  $('conexion').textContent = reintento ? 'REINTENTANDO' : 'ENVIANDO';
  llamar({c:codigo}, function(r){
    ocupado=false;
    if(r.estado==='red'){
      // Un solo reintento: cubre el arranque en frío de Apps Script
      if(!reintento){ validar(codigo, true); return; }
      $('conexion').textContent='SIN SEÑAL';
      registrarFallo(codigo);
      mostrar({estado:'malo',titulo:'SIN CONEXIÓN',
               detalle:'Toca para reintentar',
               extra:codigo+' · '+(r.causa||'sin causa'),
               reintentar:codigo});
      return;
    }
    $('conexion').textContent='LISTO';
    mostrar(r);
    if(r.estado==='ok') pedirResumen();
  });
}

function quitarFallo(codigo){
  var i=fallidos.indexOf(codigo);
  if(i>-1) fallidos.splice(i,1);
  var d=$('fallidos');
  if(!fallidos.length){ d.style.display='none'; return; }
  d.innerHTML='<b>SIN VALIDAR ('+fallidos.length+')</b><br>'+fallidos.join('<br>');
}

function registrarFallo(codigo){
  if(fallidos.indexOf(codigo)===-1) fallidos.push(codigo);
  var d=$('fallidos');
  d.style.display='block';
  d.innerHTML='<b>SIN VALIDAR ('+fallidos.length+')</b><br>'+fallidos.join('<br>');
}

/* ---------- pantalla de estado ---------- */
function mostrar(r){
  var col={ok:'var(--ok)',repetido:'var(--alerta)',malo:'var(--malo)'}[r.estado]||'var(--negro)';
  var d=$('estado');
  d.style.background=col;
  d.innerHTML='<h1>'+(r.titulo||'')+'</h1>'+
    (r.detalle?'<p class="quien">'+r.detalle+'</p>':'')+
    (r.extra?'<p class="nota">'+r.extra+'</p>':'');
  d.classList.add('ver');
  d.onclick = r.reintentar ? function(){
    d.classList.remove('ver');
    quitarFallo(r.reintentar);
    validar(r.reintentar);
  } : null;
  try{ navigator.vibrate(r.estado==='ok'?70:[60,70,60]); }catch(e){}
  clearTimeout(mostrar._t);
  mostrar._t=setTimeout(function(){ d.classList.remove('ver'); },
                        r.estado==='ok'?1300:4000);
}

/* ---------- conteo en vivo ---------- */
function pedirResumen(){
  llamar({accion:'resumen'}, function(r){
    if(r.estado==='resumen'){
      $('kDentro').textContent=r.dentro;
      $('kVend').textContent=r.total;
      $('conexion').textContent='LISTO';
    } else if(r.estado==='red'){
      $('conexion').textContent='SIN CONEXIÓN';
    }
  });
}

/* ---------- entrada manual ---------- */
function manualEnviar(){
  var i=$('manual'), v=i.value.trim();
  if(!v) return;
  i.value=''; i.blur();
  validar(normalizar(v));
}
$('manual').addEventListener('keydown',function(e){
  if(e.key==='Enter') manualEnviar();
});

/* ---------- cámara ---------- */
function alLeer(texto){
  var codigo=normalizar(texto), ahora=Date.now();
  if(codigo===ultimo && ahora-ultimoT<5000) return;   // no releer el mismo QR
  ultimo=codigo; ultimoT=ahora;
  validar(codigo);
}

function arrancar(){
  if(URL_APP.indexOf('http')!==0){
    placa('Falta configurar','Abre el archivo y llena URL_APP y CLAVE.');
    return;
  }
  if(!window.Html5Qrcode){ placa('No cargó el escáner','Revisa la conexión y recarga.'); return; }
  $('placa').style.display='none';
  lector=new Html5Qrcode('lector',{verbose:false});
  lector.start({facingMode:'environment'},
               {fps:10,qrbox:{width:250,height:250},aspectRatio:1.0},
               alLeer,function(){})
    .then(function(){ activo=true; despierto(); })
    .catch(function(err){
      placa('No se pudo abrir la cámara',
            'Acepta el permiso cuando el navegador lo pida. Si ya lo negaste, '+
            'habilítalo en los ajustes del navegador. Mientras tanto usa el '+
            'campo de abajo escribiendo el número de la entrada.', err);
    });
}

function placa(titulo,texto,err){
  $('placa').style.display='flex';
  $('placa').innerHTML='<p><b style="color:var(--hueso)">'+titulo+'</b><br><br>'+texto+'</p>'+
    '<button onclick="arrancar()">Reintentar</button>'+
    '<div class="cod">'+(err||'')+'</div>';
}

function linterna(){
  if(!activo||!lector) return;
  torch=!torch;
  lector.applyVideoConstraints({advanced:[{torch:torch}]})
    .then(function(){ $('linterna').className=torch?'on':''; })
    .catch(function(){ $('linterna').textContent='SIN LINTERNA'; torch=false; });
}

/* ---------- pantalla siempre encendida ---------- */
function despierto(){
  if(!('wakeLock' in navigator)) return;
  navigator.wakeLock.request('screen')
    .then(function(s){ wl=s; s.addEventListener('release',function(){ wl=null; }); })
    .catch(function(){});
}
document.addEventListener('visibilitychange',function(){
  if(!wl && document.visibilityState==='visible' && activo) despierto();
});

/* ---------- arranque ---------- */
window.addEventListener('load',function(){
  if(URL_APP.indexOf('http')===0){
    $('conexion').textContent='CONECTANDO';
    pedirResumen();
  }
  else placa('Falta configurar','Abre el archivo y llena URL_APP y CLAVE.');
});
</script>
</body>
</html>
