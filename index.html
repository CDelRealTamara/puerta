<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
  html,body{
    margin:0;
    background:#0B0B0B;
    color:#fff;
    font-family:Helvetica,Arial,sans-serif;
  }

  .barra{
    padding:14px 16px;
    background:#151515;
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
  }

  .barra input{
    flex:1;
    min-width:150px;
    padding:14px;
    font-size:17px;
    border:1px solid #444;
    background:#0B0B0B;
    color:#fff;
    border-radius:6px;
    box-sizing:border-box;
  }

  .barra button{
    padding:14px 20px;
    font-size:17px;
    border:0;
    border-radius:6px;
    background:#fff;
    color:#0B0B0B;
    font-weight:bold;
  }

  #lector{
    width:100%;
    max-width:520px;
    margin:0 auto;
  }

  .cont{
    padding:12px 16px;
    font-size:14px;
    opacity:.7;
  }

  .aviso{
    padding:16px;
    line-height:1.5;
    font-size:15px;
    background:#151515;
  }

  #estado{
    position:fixed;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    z-index:99;
  }

  #estado h1{
    font-size:42px;
    margin:0 0 10px;
    letter-spacing:2px;
  }

  #estado p{
    font-size:21px;
    margin:4px 0;
  }

  #estado small{
    opacity:.75;
    font-size:15px;
    margin-top:12px;
  }
</style>
</head>

<body>

<div class="barra">
  <input
    id="manual"
    inputmode="numeric"
    placeholder="Número: 7   (o BLIND-0007)"
    autocomplete="off"
  >

  <button onclick="manualEnviar()">Validar</button>
</div>

<div id="lector"></div>

<div class="cont" id="cont">
  Ingresos registrados en esta sesión: 0
</div>

<div id="estado"></div>


<script>

/* =========================================================
   CONFIGURACIÓN
   ========================================================= */

/*
   URL REAL DE TU GOOGLE APPS SCRIPT
*/
var URL_APP =
  'https://script.google.com/macros/s/AKfycbzVhEzz1lq8uP1wBxGth6E9CCky3XbIKV6bFXqasWgJuOAxA6OpxHjW4O1-nUMEY3M/exec';


/*
   CLAVE DE LA PUERTA

   Es la misma que tienes en Codigo.gs:
   puerta-rvu171vked8pt1
*/
var CLAVE = 'puerta-rvu171vked8pt1';


/* =========================================================
   VARIABLES
   ========================================================= */

var ultimo = '';
var ultimoT = 0;
var total = 0;
var lector = null;
var ocupado = false;


/* =========================================================
   MOSTRAR RESULTADO
   ========================================================= */

function mostrar(r){

  ocupado = false;

  var col = {
    ok:'#0B7A3B',
    repetido:'#B8860B',
    malo:'#B00020'
  }[r.estado] || '#0B0B0B';

  var d = document.getElementById('estado');

  d.style.background = col;
  d.style.display = 'flex';

  d.innerHTML =
    '<h1>' + (r.titulo || '') + '</h1>' +
    '<p>' + (r.detalle || '') + '</p>' +
    '<small>' + (r.extra || '') + '</small>';

  if(r.estado === 'ok'){

    total++;

    document.getElementById('cont').textContent =
      'Ingresos registrados en esta sesión: ' + total;
  }

  try{

    navigator.vibrate(
      r.estado === 'ok'
        ? 80
        : [60,60,60]
    );

  }catch(e){}

  setTimeout(function(){

    d.style.display = 'none';

  }, r.estado === 'ok' ? 1400 : 2800);
}


/* =========================================================
   VALIDAR CÓDIGO
   ========================================================= */

/*
   IMPORTANTE:

   Antes utilizábamos:

   google.script.run
       .registrarDesdeEscaner(...)

   Eso es lo que estaba dando "SIN SEÑAL".

   Ahora usamos JSONP directamente contra el Web App.
*/

function validar(codigo){

  if(ocupado) return;

  ocupado = true;

  var callback =
    'blindCallback_' + Date.now();


  /*
     Creamos dinámicamente una función global.
  */

  window[callback] = function(r){

    try{

      mostrar(r);

    }finally{

      delete window[callback];

      var viejo =
        document.getElementById(callback);

      if(viejo){
        viejo.remove();
      }
    }
  };


  /*
     Creamos una etiqueta <script>.

     Esto permite recibir JSONP desde
     Google Apps Script sin problemas de CORS.
  */

  var s =
    document.createElement('script');

  s.id = callback;


  /*
     Si Google no responde:
     mostrar error.
  */

  s.onerror = function(){

    delete window[callback];

    if(s.parentNode){
      s.parentNode.removeChild(s);
    }

    mostrar({
      estado:'malo',
      titulo:'SIN CONEXIÓN',
      detalle:'No se pudo contactar el servidor',
      extra:'Intenta escanear nuevamente'
    });
  };


  /*
     URL QUE SE ENVÍA A APPS SCRIPT
  */

  var url =
    URL_APP +
    '?jsonp=' +
    encodeURIComponent(callback) +
    '&k=' +
    encodeURIComponent(CLAVE) +
    '&c=' +
    encodeURIComponent(codigo);


  /*
     Para depuración, puedes verlo
     en la consola del navegador.
  */

  console.log('Enviando código:', codigo);
  console.log('URL:', url);


  s.src = url;

  document.body.appendChild(s);


  /*
     Timeout de seguridad.
     Si pasan 10 segundos sin respuesta,
     mostramos error.
  */

  setTimeout(function(){

    if(window[callback]){

      delete window[callback];

      if(s.parentNode){
        s.parentNode.removeChild(s);
      }

      if(ocupado){

        mostrar({
          estado:'malo',
          titulo:'SIN CONEXIÓN',
          detalle:'El servidor tardó demasiado',
          extra:'Intenta escanear nuevamente'
        });
      }
    }

  },10000);
}


/* =========================================================
   VALIDACIÓN MANUAL
   ========================================================= */

function manualEnviar(){

  var i =
    document.getElementById('manual');

  var v =
    i.value.trim();

  if(!v) return;

  i.value = '';

  i.blur();

  validar(extraer(v));
}


document
  .getElementById('manual')
  .addEventListener('keydown', function(e){

    if(e.key === 'Enter'){
      manualEnviar();
    }

  });


/* =========================================================
   EXTRAER CÓDIGO
   ========================================================= */

var PREFIJO = 'BLIND';


function extraer(texto){

  var t =
    String(texto).trim();


  /*
     Si el QR contiene una URL:

     https://.../exec?c=BLIND-0001

     extraemos BLIND-0001
  */

  var m =
    t.match(/[?&]c=([^&#]+)/);


  if(m){

    return decodeURIComponent(m[1])
      .toUpperCase();
  }


  /*
     Si escriben solamente:

     7

     lo convertimos a:

     BLIND-0007
  */

  if(/^\d{1,4}$/.test(t)){

    return PREFIJO +
      '-' +
      ('0000' + t).slice(-4);
  }


  /*
     Si ya escriben:

     BLIND-0007

     lo dejamos así.
  */

  return t.toUpperCase();
}


/* =========================================================
   CUANDO LA CÁMARA LEE UN QR
   ========================================================= */

function alLeer(texto){

  var codigo =
    extraer(texto);

  var ahora =
    Date.now();


  /*
     Evita leer el mismo QR varias veces
     mientras sigue frente a la cámara.
  */

  if(
    codigo === ultimo &&
    ahora - ultimoT < 5000
  ){

    return;
  }


  ultimo = codigo;
  ultimoT = ahora;


  console.log('QR leído:', codigo);


  validar(codigo);
}


/* =========================================================
   ARRANCAR CÁMARA
   ========================================================= */

function arrancar(){

  if(!window.Html5Qrcode){

    sinCamara(
      'No cargó la librería del escáner'
    );

    return;
  }


  lector =
    new Html5Qrcode('lector');


  lector.start(

    { facingMode:'environment' },

    {
      fps:10,
      qrbox:{
        width:260,
        height:260
      }
    },

    alLeer,

    function(){}
  )

  .catch(function(err){

    sinCamara(err);

  });
}


/* =========================================================
   ERROR DE CÁMARA
   ========================================================= */

function sinCamara(err){

  document
    .getElementById('lector')
    .innerHTML =

    '<div class="aviso">' +

    '<b>Sin cámara en este teléfono.</b>' +

    '<br><br>' +

    'En iPhone, Google bloquea la cámara dentro de esta página. ' +

    'Usa el campo de arriba: pide al invitado el número de su entrada ' +

    'y escribe solo los dígitos. Para BLIND-0007, teclea <b>7</b>.' +

    '<br><br>' +

    'También puedes pegar la URL completa del QR.' +

    '<br><br>' +

    '<small style="opacity:.55;">' +
    err +
    '</small>' +

    '</div>';
}


/* =========================================================
   INICIAR
   ========================================================= */

window.addEventListener(
  'load',
  arrancar
);

</script>

</body>
</html>
